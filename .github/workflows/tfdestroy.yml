name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: 'Type "DESTROY" to confirm'
        required: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:   
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ secrets.AWSROLE }}
          role-session-name: github-actions-build-and-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
      
      - name: Terraform List
        run: |
          cd infra
          terraform init -input=false
          echo "Continuing with this workflow will delete all resources managed by this terraform state as listed below"
          terraform state list
          
      - name: Confirm Destroy
        run: |
          if [[ "${{ github.event.inputs.confirm_destroy }}" != "DESTROY" ]]; then
            echo "Destroy not confirmed. Exiting."
            exit 1
          fi

      - name: Terraform Destroy
        run: |
          cd infra
          terraform destroy -auto-approve